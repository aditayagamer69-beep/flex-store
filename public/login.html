<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • Flex Store</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

    <div class="brand">
        <div class="brand-icon">F</div>
        <span>Flex Store</span>
    </div>

    <div class="auth-card">

        <div class="auth-header">
            <span class="welcome">WELCOME BACK</span>
            <h1>Sign in to Flex Store</h1>
            <p>Access your plugins, purchases and account.</p>
        </div>

        <form id="loginForm">

            <label>Username or Email</label>
            <input
                type="text"
                id="login"
                placeholder="Enter your username or email"
                autocomplete="username"
                required
            >

            <label>Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >

                <button type="button" id="showPassword">
                    Show
                </button>
            </div>

            <button class="primary-button" type="submit">
                Login
            </button>

            <div id="message"></div>

        </form>

        <div class="divider">
            <span>NEW TO FLEX STORE?</span>
        </div>

        <a href="register.html" class="secondary-button">
            Create an Account
        </a>

        <a href="/" class="back-home">
            ← Back to Store
        </a>

    </div>

    <p class="footer-text">
        © 2026 Flex Store
    </p>

</div>

<script src="auth.js"></script>

</body>
</html>
