<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account • Flex Store</title>
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-page">

    <div class="brand">
        <div class="brand-icon">F</div>
        <span>Flex Store</span>
    </div>

    <div class="auth-card">

        <div class="auth-header">
            <span class="welcome">JOIN FLEX STORE</span>
            <h1>Create your account</h1>
            <p>Choose your own username and start exploring.</p>
        </div>

        <form id="registerForm">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Choose your username"
                minlength="3"
                maxlength="20"
                autocomplete="username"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >

            <label>Password</label>

            <div class="password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >

                <button type="button" id="showPassword">
                    Show
                </button>
            </div>

            <label>Confirm Password</label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                minlength="8"
                autocomplete="new-password"
                required
            >

            <button class="primary-button" type="submit">
                Create Account
            </button>

            <div id="message"></div>

        </form>

        <div class="divider">
            <span>ALREADY HAVE AN ACCOUNT?</span>
        </div>

        <a href="login.html" class="secondary-button">
            Login
        </a>

        <a href="/" class="back-home">
            ← Back to Store
        </a>

    </div>

    <p class="footer-text">
        © 2026 Flex Store
    </p>

</div>

<script src="auth.js"></script>

</body>
</html>
