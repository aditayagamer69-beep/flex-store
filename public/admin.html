<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Owner Panel — Flex Store</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .admin-page {

            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;

        }

        .admin-header {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;

        }

        .admin-header h1 {

            margin: 0;

        }

        .admin-header p {

            color: #64748b;

        }

        .logout-btn {

            border: none;
            padding: 11px 18px;
            border-radius: 10px;
            cursor: pointer;
            background: #ef4444;
            color: white;
            font-weight: 700;

        }

        .admin-card {

            background: rgba(255,255,255,0.8);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 30px;

        }

        .admin-card h2 {

            margin-top: 0;

        }

        .form-grid {

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;

        }

        .form-group {

            display: flex;
            flex-direction: column;
            gap: 7px;

        }

        .form-group.full {

            grid-column: 1 / -1;

        }

        .form-group label {

            font-weight: 700;

        }

        .form-group input,
        .form-group textarea,
        .form-group select {

            padding: 12px;
            border: 1px solid #dbe2ea;
            border-radius: 10px;
            font: inherit;
            background: white;

        }

        .form-group textarea {

            min-height: 130px;
            resize: vertical;

        }

        .submit-btn {

            margin-top: 20px;
            border: none;
            padding: 13px 22px;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-weight: 700;
            cursor: pointer;

        }

        .submit-btn:disabled {

            opacity: 0.6;
            cursor: not-allowed;

        }

        .message {

            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;

        }

        .message.success {

            display: block;
            background: #dcfce7;
            color: #166534;

        }

        .message.error {

            display: block;
            background: #fee2e2;
            color: #991b1b;

        }

        .plugin-list {

            display: grid;
            gap: 15px;

        }

        .managed-plugin {

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            padding: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            background: white;

        }

        .managed-info h3 {

            margin: 0 0 6px;

        }

        .managed-info p {

            margin: 4px 0;
            color: #64748b;

        }

        .managed-meta {

            font-size: 14px;
            color: #475569;

        }

        .delete-btn {

            border: none;
            padding: 10px 15px;
            border-radius: 9px;
            background: #ef4444;
            color: white;
            font-weight: 700;
            cursor: pointer;
            flex-shrink: 0;

        }

        .delete-btn:hover {

            background: #dc2626;

        }

        .empty {

            text-align: center;
            padding: 30px;
            color: #64748b;

        }

        @media (max-width: 700px) {

            .form-grid {

                grid-template-columns: 1fr;

            }

            .form-group.full {

                grid-column: auto;

            }

            .admin-header {

                align-items: flex-start;
                flex-direction: column;

            }

            .managed-plugin {

                flex-direction: column;
                align-items: flex-start;

            }

        }

    </style>

</head>


<body>


<header class="topbar">


    <div class="logo">

        <div class="logo-icon">
            F
        </div>

        <span>
            Flex Store
        </span>

    </div>


    <nav class="nav-links">

        <a href="/">
            Store
        </a>

        <a href="/admin.html" class="active">
            Owner Panel
        </a>

    </nav>


    <div class="nav-actions">

        <button
            class="logout-btn"
            id="logoutButton"
        >
            Logout
        </button>

    </div>


</header>



<main class="admin-page">

    <!-- WEBSITE VISITS -->

    <section class="admin-card">

        <h2>
            Website Visits
        </h2>

        <p>
            Total visits to your Flex Store website.
        </p>

        <div
            id="adminVisitorCount"
            style="
                font-size: 36px;
                font-weight: 800;
                margin-top: 12px;
            "
        >
            0
        </div>

        <p
            style="
                margin-top: 4px;
                opacity: 0.7;
            "
        >
            Total Website Visits
        </p>

    </section>





    <div class="admin-header">

        <div>

            <h1>
                Owner Panel
            </h1>

            <p id="ownerText">
                Checking owner access...
            </p>

        </div>

    </div>



    <!-- ADD PLUGIN -->

    <section class="admin-card">

        <h2>
            Add Plugin
        </h2>

        <p>
            Upload a Minecraft plugin to Flex Store.
        </p>


        <form
            id="pluginForm"
            enctype="multipart/form-data"
        >


            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Plugin Name
                    </label>

                    <input
                        type="text"
                        name="pluginName"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Version
                    </label>

                    <input
                        type="text"
                        name="version"
                        placeholder="1.0.0"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Category
                    </label>

                    <input
                        type="text"
                        name="category"
                        placeholder="Utility"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Price (₹)
                    </label>

                    <input
                        type="number"
                        name="price"
                        min="0"
                        step="1"
                        value="0"
                    >

                </div>



                <div class="form-group full">

                    <label>
                        Description
                    </label>

                    <textarea
                        name="description"
                        required
                    ></textarea>

                </div>



                <div class="form-group">

                    <label>
                        Plugin JAR
                    </label>

                    <input
                        type="file"
                        name="pluginJar"
                        accept=".jar"
                        required
                    >

                </div>



                <div class="form-group">

                    <label>
                        Plugin Logo
                    </label>

                    <input
                        type="file"
                        name="pluginLogo"
                        accept=".png,.jpg,.jpeg,.webp"
                    >

                </div>


            </div>


            <button
                type="submit"
                class="submit-btn"
                id="submitButton"
            >
                Add Plugin
            </button>


            <div
                id="formMessage"
                class="message"
            ></div>


        </form>

    </section>



    <!-- MANAGE PLUGINS -->

    <section class="admin-card">

        <h2>
            Manage Plugins
        </h2>

        <p>
            Plugins currently available on Flex Store.
        </p>


        <div
            class="plugin-list"
            id="pluginList"
        >

            <div class="empty">
                Loading plugins...
            </div>

        </div>

    </section>


</main>



<script>


/* =========================
   OWNER CHECK
========================= */


async function checkOwner() {


    try {


        const response =
            await fetch(
                "/api/owner-test"
            );


        if (!response.ok) {

            window.location.href =
                "/login.html";

            return;

        }


        const data =
            await response.json();


        document.getElementById(
            "ownerText"
        ).textContent =
            `Logged in as ${data.username} • Owner`;


        loadPlugins();


    } catch (error) {


        window.location.href =
            "/login.html";

    }

}



/* =========================
   LOAD PLUGINS
========================= */


async function loadPlugins() {


    const list =
        document.getElementById(
            "pluginList"
        );


    try {


        const response =
            await fetch(
                "/api/plugins"
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                "Failed to load plugins."
            );

        }


        if (
            !data.plugins.length
        ) {


            list.innerHTML = `

                <div class="empty">

                    No plugins available.

                </div>

            `;


            return;

        }


        list.innerHTML = "";


        data.plugins.forEach(
            plugin => {


                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "managed-plugin";


                item.innerHTML = `

                    <div class="managed-info">

                        <h3>
                            ${escapeHTML(
                                plugin.name
                            )}
                        </h3>

                        <p>
                            ${escapeHTML(
                                plugin.description
                            )}
                        </p>

                        <div class="managed-meta">

                            Version:
                            ${escapeHTML(
                                plugin.version
                            )}

                            &nbsp; • &nbsp;

                            Category:
                            ${escapeHTML(
                                plugin.category
                            )}

                            &nbsp; • &nbsp;

                            Price:
                            ₹${Number(
                                plugin.price
                            )}

                        </div>

                    </div>


                    <button
                        class="delete-btn"
                        data-slug="${escapeHTML(
                            plugin.slug
                        )}"
                    >
                        Delete
                    </button>

                `;


                list.appendChild(
                    item
                );


            }
        );


        document
            .querySelectorAll(
                ".delete-btn"
            )
            .forEach(
                button => {


                    button.addEventListener(
                        "click",
                        () => {

                            deletePlugin(
                                button.dataset.slug
                            );

                        }
                    );


                }
            );


    } catch (error) {


        console.error(
            error
        );


        list.innerHTML = `

            <div class="empty">

                Failed to load plugins.

            </div>

        `;

    }

}



/* =========================
   DELETE PLUGIN
========================= */


async function deletePlugin(
    slug
) {


    const confirmed =
        confirm(
            "Are you sure you want to delete this plugin?"
        );


    if (!confirmed) {

        return;

    }


    try {


        const response =
            await fetch(

                `/api/plugins/${encodeURIComponent(
                    slug
                )}`,

                {

                    method:
                        "DELETE"

                }

            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Delete failed."
            );

            return;

        }


        alert(
            "Plugin deleted successfully!"
        );


        loadPlugins();


    } catch (error) {


        console.error(
            error
        );


        alert(
            "Something went wrong."
        );

    }

}



/* =========================
   ADD PLUGIN
========================= */


document
    .getElementById(
        "pluginForm"
    )
    .addEventListener(
        "submit",
        async event => {


            event.preventDefault();


            const form =
                event.target;


            const button =
                document.getElementById(
                    "submitButton"
                );


            const message =
                document.getElementById(
                    "formMessage"
                );


            const formData =
                new FormData(
                    form
                );


            button.disabled =
                true;


            button.textContent =
                "Uploading...";


            message.className =
                "message";


            message.textContent =
                "";


            try {


                const response =
                    await fetch(
                        "/api/plugins",
                        {

                            method:
                                "POST",

                            body:
                                formData

                        }
                    );


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.message ||
                        "Upload failed."
                    );

                }


                message.className =
                    "message success";


                message.textContent =
                    "Plugin added successfully!";


                form.reset();


                loadPlugins();


            } catch (error) {


                message.className =
                    "message error";


                message.textContent =
                    error.message ||
                    "Upload failed.";


            } finally {


                button.disabled =
                    false;


                button.textContent =
                    "Add Plugin";


            }

        }
    );



/* =========================
   LOGOUT
========================= */


document
    .getElementById(
        "logoutButton"
    )
    .addEventListener(
        "click",
        async () => {


            await fetch(
                "/api/logout",
                {
                    method:
                        "POST"
                }
            );


            window.location.href =
                "/login.html";

        }
    );



/* =========================
   HTML SAFETY
========================= */


function escapeHTML(
    value
) {


    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



/* =========================
   START
========================= */

checkOwner();



// Load total website visits
async function loadAdminVisitorCount() {

    try {

        const response =
            await fetch("/api/visitor-count");

        const data =
            await response.json();

        const counter =
            document.getElementById("adminVisitorCount");

        if (counter) {
            counter.textContent =
                Number(data.count || 0).toLocaleString();
        }

    } catch (error) {

        console.error(
            "Visitor count error:",
            error
        );

    }

}

loadAdminVisitorCount();

</script>


</body>

</html>
